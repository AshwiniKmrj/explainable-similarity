name: CI

# Runs on pushes only. Pull requests from forks cannot read the secrets, so the model download would fail there.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as the Dockerfile
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Same order and versions as the Dockerfile, so the tests run against what the image ships.
      - name: Install dependencies
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # The model is private
      # The share must hold the contents of models/ at its root.
      - name: Download the model from private storage
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
          AZURE_FILE_SHARE: ${{ secrets.AZURE_FILE_SHARE }}
        run: |
          mkdir -p models
          az storage file download-batch --source "$AZURE_FILE_SHARE" --destination models --output none --no-progress

      # This log is public. --tb=no and -rN report which tests failed without printing the compared values.
      - name: Run tests
        run: pytest -v --tb=no -rN

  # Builds the image and stores it in the Azure container registry, but only if the tests passed.
  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # lets this job prove to Azure that it runs in this repository, so no password is stored
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        run: az acr login --name "$ACR_NAME"

      # Each image is tagged with the commit it was built from, so a running version can be traced to its code.
      - name: Build and push the image
        run: |
          IMAGE="$ACR_NAME.azurecr.io/explainable-similarity"
          docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

  # Points the running app at the image that was just pushed. Azure starts it as a new revision and moves traffic
  # to it only once it is ready, so an image that cannot start leaves the previous version serving.
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: deploy # one deployment at a time; a second push waits for the first to finish
    permissions:
      id-token: write # same password-free sign-in to Azure as the docker job
    env:
      RESOURCE_GROUP: explainable-similarity-rg
      APP_NAME: explainable-similarity
      ACR_NAME: ${{ secrets.ACR_NAME }}
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the new image
        run: |
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --image "$ACR_NAME.azurecr.io/explainable-similarity:${GITHUB_SHA::7}" --output none

      # The update returns before the container has started. Waiting here makes a version that cannot start
      # fail this job instead of going unnoticed.
      - name: Wait for the new revision to become healthy
        run: |
          revision=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --query properties.latestRevisionName --output tsv)
          for attempt in $(seq 1 40); do
            health=$(az containerapp revision show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
              --revision "$revision" --query properties.healthState --output tsv)
            echo "attempt $attempt: $revision is ${health:-starting}"
            if [ "$health" = "Healthy" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::$revision did not become healthy within 10 minutes"
          exit 1
